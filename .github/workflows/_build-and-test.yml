name: Build and Test

on:
  workflow_call:
    inputs:
      solution_file:
        required: true
        type: string
    secrets:
      gitops_pat:
        required: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      NUGET_USERNAME: ${{ github.actor }}
      NUGET_PASSWORD: ${{ secrets.gitops_pat }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ${{ inputs.solution_file }} /p:GITHUB_ACTIONS=true

      - name: Build
        run: dotnet build ${{ inputs.solution_file }} --configuration Release --no-restore /p:GITHUB_ACTIONS=true

      - name: Test
        run: dotnet test ${{ inputs.solution_file }} --configuration Release --no-build --verbosity normal
